<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CardPay Admin</title>
<meta name="theme-color" content="#0f4278">
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --border: #e2e2df;
    --text: #1a1a18;
    --text-secondary: #6b6b66;
    --accent: #185fa5;
    --accent-dark: #0f4278;
    --green: #0f6e56;
    --red: #a32d2d;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; padding: 16px 16px 70px; max-width: 560px; width: 100%; margin: 0 auto; }
  
  /* Tarja Azul Superior */
  .topbar {
    background: var(--accent-dark); color: #fff;
    padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; }
  .brand-name { font-weight: 700; font-size: 19px; }
  .topbar-sub { opacity: .65; font-size: 12px; margin-top: 2px; }
  .faturamento-tarja { font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 6px; margin-top: 3px; display: inline-block; color: #bbf7d0; }
  .btn-close-top { background: none; border: none; color: #fff; font-size: 22px; text-decoration: none; cursor: pointer; }
  
  /* Menu Inferior (Tabbar) */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center; z-index: 10;
  }
  .tabbar button {
    background: none; border: none; padding: 6px; color: var(--text-secondary);
    display: flex; flex-direction: column; align-items: center; font-size: 11px; font-family: inherit; cursor: pointer; flex: 1;
  }
  .tabbar button.active { color: var(--accent); font-weight: 600; }
  .tabbar button .ic { font-size: 20px; margin-bottom: 2px; }

  /* Elementos de Layout */
  .card-panel { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
  .panel-title { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--text-secondary); text-transform: uppercase; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 5px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; background: #fff;
  }
  .btn { padding: 11px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; color: #fff; cursor: pointer; width: 100%; text-align: center; }
  .btn-teal { background: #14b8a6; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; }
  .list-item:last-child { border-bottom: none; }
  .empty { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 14px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_uF7dXCy27GG5-PnvVszpWw_hmgMjfK5";
const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

// ---------- Estado do App ----------
const state = {
  tab: "relatorios", 
  tabs: [],
  vendas: [],
  totalFaturado: 0
};

// ---------- Conectores do Banco ----------
async function sbGet(table, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function addItem(table, payload) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: "POST",
      headers: { ...headers, "Prefer": "return=representation" },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      alert("Item adicionado com sucesso!");
      init();
    }
  } catch (e) {
    alert("Erro ao salvar item.");
  }
}

function formatMoney(v) {
  return "R$ " + (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ---------- Renderização da Interface ----------
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  
  const main = document.createElement("main");
  main.appendChild(Body());
  
  app.appendChild(TopBar());
  app.appendChild(main);
  app.appendChild(Tabbar());
}

function TopBar(){
  const bar = document.createElement("div"); bar.className="topbar";
  const titulos = { abas:"Abas", produtos:"Produtos", vendedores:"Vendedores", cartoes:"Caixinha", relatorios:"Relatórios", config:"Config" };
  
  const subinfo = state.tab === "relatorios" 
    ? `<div class="faturamento-tarja" id="tarja-valor-total">Faturamento Total: ${formatMoney(state.totalFaturado)}</div>`
    : `<div class="topbar-sub">Gestão Geral · CardPay</div>`;

  bar.innerHTML = `
    <div class="brand">
      <div class="brand-mark">CP</div>
      <div>
        <div class="brand-name">${titulos[state.tab] || "Admin"}</div>
        ${subinfo}
      </div>
    </div>
    <a href="index.html" class="btn-close-top">✕</a>
  `;
  return bar;
}

function Tabbar(){
  const bar = document.createElement("div"); bar.className="tabbar";
  const items = [["abas","🏷️","Abas"], ["relatorios","📊","Relatórios"]];
  items.forEach(([key,ic,label])=>{
    const b = document.createElement("button"); b.className = state.tab===key ? "active" : "";
    b.innerHTML = `<span class="ic">${ic}</span><span>${label}</span>`;
    b.onclick = () => { state.tab = key; render(); }; 
    bar.appendChild(b);
  });
  return bar;
}

function Body(){
  const wrap = document.createElement("div");
  if(state.tab==="abas") wrap.appendChild(AdminTabs());
  if(state.tab==="relatorios") wrap.appendChild(ReportsPanel());
  return wrap;
}

/* ===================== CONTEÚDO DOS PAINÉIS ===================== */
function AdminTabs(){
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="card-panel">
      <p class="panel-title">Nova aba</p>
      <div class="field">
        <input type="text" id="tabName" placeholder="Nome da nova aba">
      </div>
      <button class="btn btn-teal" id="btnAddTab">Adicionar aba</button>
    </div>
    <div class="card-panel">
      <p class="panel-title">Abas Cadastradas</p>
      <div id="tabsList"><div class="empty">Carregando abas...</div></div>
    </div>
  `;
  
  setTimeout(() => {
    div.querySelector("#btnAddTab").onclick = () => {
      const nome = div.querySelector("#tabName").value;
      if(nome) addItem("tabs", { name: nome });
    };
    
    const list = div.querySelector("#tabsList");
    if(state.tabs.length === 0) {
      list.innerHTML = `<div class="empty">Nenhuma aba cadastrada.</div>`;
    } else {
      list.innerHTML = "";
      state.tabs.forEach(t => {
        list.innerHTML += `<div class="list-item"><b>${t.name}</b><span>ID: ${t.id}</span></div>`;
      });
    }
  }, 50);
  
  return div;
}

function ReportsPanel(){
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="card-panel">
      <p class="panel-title">Histórico de Transações</p>
      <div id="salesList"></div>
    </div>
  `;
  
  setTimeout(() => {
    const list = div.querySelector("#salesList");
    if(state.vendas.length === 0) {
      list.innerHTML = `<div class="empty">Nenhuma venda realizada ou erro ao conectar com a tabela do banco.</div>`;
    } else {
      list.innerHTML = "";
      state.vendas.forEach((v, index) => {
        const valorExibir = v.total || v.valor || 0;
        list.innerHTML += `
          <div class="list-item">
            <div>
              <b>Venda #${v.id || index + 1}</b>
              <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">
                ${v.created_at ? new Date(v.created_at).toLocaleString('pt-BR') : 'Data não informada'}
              </div>
            </div>
            <span style="color:var(--green); font-weight:bold;">+ ${formatMoney(valorExibir)}</span>
          </div>`;
      });
    }
  }, 50);
  
  return div;
}

// ---------- Inicializador Inteligente ----------
async function init() {
  try { state.tabs = await sbGet("tabs", "select=*&order=name"); } catch(e) {}
  
  try {
    state.vendas = await sbGet("vendas", "select=*&order=created_at.desc");
  } catch (e) {
    try {
      state.vendas = await sbGet("venda", "select=*");
    } catch (err) {
      state.vendas = [];
    }
  }
  
  // Soma os valores
  state.totalFaturado = state.vendas.reduce((acc, atual) => {
    const preco = atual.total || atual.valor || 0;
    return acc + (Number(preco) || 0);
  }, 0);
  
  // CORREÇÃO: Força a interface inteira a atualizar assim que a soma termina!
  render();
}

// Executa o sistema
init();
</script>
</body>
</html>
