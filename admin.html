<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardPay Admin</title>
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#0f4278">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CardPay Admin">
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --border: #e2e2df;
    --text: #1a1a18;
    --text-secondary: #6b6b66;
    --accent: #185fa5;
    --accent-dark: #0f4278;
    --green: #0f6e56;
    --red: #a32d2d;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 60px; min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; margin: -16px -16px 16px;
    background: var(--accent-dark); color: #fff;
  }
  .topbar .logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: #14b8a6; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .sub { font-size: 12px; opacity: 0.8; }
  .topbar .back { margin-left: auto; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  h2.section-title { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 12px; font-family: inherit;
  }
  select { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
  button {
    padding: 11px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer; width: 100%;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
  .list-item .info b { font-size: 14px; }
  .list-item .info p { font-size: 12px; color: var(--text-secondary); margin: 2px 0 0; }
  .tabs-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
  .tabs-nav button { width: auto; white-space: nowrap; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .tabs-nav button.active { background: var(--accent); color: #fff; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .msg.success { background: #d1fae5; color: var(--green); }
  .msg.error { background: #fee2e2; color: var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div id="app"></div>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_uF7dXCy27GG5-PnvVszpWw_hmgMjfK5";
const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

async function sbGet(table, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbInsert(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST", headers: { ...headers, "Prefer": "return=representation" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbDelete(table, match) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${match}`, { method: "DELETE", headers });
  if (!res.ok) throw new Error(await res.text());
}

function formatMoney(v) {
  return "R$ " + (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const state = {
  tela: "admin_login",
  adminSecao: "abas",
  abas: [],
  produtos: [],
  vendedores: [],
  cards: [],
  sales: [],
  resumoProdutos: {},
  appSettings: null,
  configLiberado: false
};

const app = document.getElementById("app");

function ir(tela) {
  state.tela = tela;
  render();
}

function topbar(titulo, subtitulo, temVoltar, voltarPara) {
  return `
    <div class="topbar">
      <div class="logo">CP</div>
      <div>
        <h1>${titulo}</h1>
        ${subtitulo ? `<div class="sub">${subtitulo}</div>` : ""}
      </div>
      ${temVoltar ? `<button class="back" onclick="ir('${voltarPara}')">✕</button>` : ""}
    </div>
  `;
}

async function carregarDadosAdmin() {
  try {
    const [abas, produtos, vendedores, cards, sales, settings] = await Promise.all([
      sbGet("tabs", "select=*&order=name"),
      sbGet("products", "select=*&order=name"),
      sbGet("vendedores", "select=*&order=name"),
      sbGet("cards", "select=*&order=card_number"),
      sbGet("sales", "select=*&order=created_at.desc"),
      sbGet("app_settings", "select=*&limit=1")
    ]);
    state.abas = abas;
    state.produtos = produtos;
    state.vendedores = vendedores;
    state.cards = cards;
    state.sales = sales;
    state.appSettings = settings[0] || null;

    // Calcular resumo por produto
    state.resumoProdutos = {};
    state.produtos.forEach(p => {
      state.resumoProdutos[p.id] = { name: p.name, qtd: 0, total: 0 };
    });
    state.sales.forEach(v => {
      if (v.itens && Array.isArray(v.itens)) {
        v.itens.forEach(item => {
          if (state.resumoProdutos[item.id]) {
            state.resumoProdutos[item.id].qtd += (item.qtd || 0);
            state.resumoProdutos[item.id].total += ((item.price || 0) * (item.qtd || 0));
          }
        });
      }
    });
  } catch (e) {
    console.error(e);
  }
}

function render() {
  if (state.tela === "admin_login") renderAdminLogin();
  else if (state.tela === "admin_painel") renderAdminPainel();
}

function renderAdminLogin() {
  app.innerHTML = `
    ${topbar("Painel Admin", "Autenticação", false)}
    <div class="card">
      <label>Senha de Acesso</label>
      <input type="password" id="admin-senha" placeholder="Digite a senha admin">
      <button id="btn-logar-admin">Acessar Painel</button>
      <div id="admin-login-msg" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById("btn-logar-admin").onclick = async () => {
    const senha = document.getElementById("admin-senha").value;
    if (senha === "1234") {
      await carregarDadosAdmin();
      ir("admin_painel");
    } else {
      document.getElementById("admin-login-msg").innerHTML = `<p class="msg error">Senha incorreta.</p>`;
    }
  };
}

function renderAdminPainel() {
  let secaoHtml = "";
  if (state.adminSecao === "abas") {
    secaoHtml = `
      <div class="card">
        <h2 class="section-title">Cadastrar Nova Aba</h2>
        <input type="text" id="nova-aba-nome" placeholder="Nome da Aba (ex: Bebidas)">
        <button id="btn-salvar-aba">Salvar Aba</button>
      </div>
      <div class="card">
        <h2 class="section-title">Abas Ativas</h2>
        <div id="lista-abas"></div>
      </div>
    `;
  } else if (state.adminSecao === "produtos") {
    secaoHtml = `
      <div class="card">
        <h2 class="section-title">Cadastrar Novo Produto</h2>
        <label>Nome do Produto</label>
        <input type="text" id="p-nome">
        <label>Preço</label>
        <input type="number" id="p-preco" step="0.01">
        <label>Aba vinculada</label>
        <select id="p-aba"></select>
        <button id="btn-salvar-produto">Salvar Produto</button>
      </div>
      <div class="card">
        <h2 class="section-title">Produtos Cadastrados</h2>
        <div id="lista-produtos"></div>
      </div>
    `;
  } else if (state.adminSecao === "vendedores") {
    secaoHtml = `
      <div class="card">
        <h2 class="section-title">Cadastrar Vendedor</h2>
        <input type="text" id="v-nome" placeholder="Nome do Vendedor">
        <button id="btn-salvar-vendedor">Salvar Vendedor</button>
      </div>
      <div class="card">
        <h2 class="section-title">Vendedores Ativos</h2>
        <div id="lista-vendedores"></div>
      </div>
    `;
  } else if (state.adminSecao === "relatorios") {
    let totalGeralVendas = state.sales.reduce((acc, v) => {
      if (v.itens && Array.isArray(v.itens)) {
        return acc + v.itens.reduce((s, i) => s + ((i.price || 0) * (i.qtd || 0)), 0);
      }
      return acc + (v.total || v.valor || 0);
    }, 0);

    secaoHtml = `
      <div class="card" style="background:var(--accent-dark); color:#fff; text-align:center; padding:20px;">
        <div style="font-size:13px; opacity:0.8; text-transform:uppercase; font-weight:600;">Faturamento Geral Acumulado</div>
        <div style="font-size:26px; font-weight:800; margin-top:4px; color:#bbf7d0;">${formatMoney(totalGeralVendas)}</div>
      </div>
      <div class="card">
        <h2 class="section-title">Resumo por Produto</h2>
        <div id="lista-resumo-produtos"></div>
      </div>
      <div class="card">
