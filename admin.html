<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CardPay Admin</title>
<meta name="theme-color" content="#0f4278">
<style>
  :root { --bg: #f4f4f2; --card: #ffffff; --border: #e2e2df; --text: #1a1a18; --text-secondary: #6b6b66; --accent: #185fa5; --accent-dark: #0f4278; --green: #0f6e56; --radius: 12px; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: var(--bg); color: var(--text); }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; padding: 16px 16px 70px; max-width: 560px; width: 100%; margin: 0 auto; }
  .topbar { background: var(--accent-dark); color: #fff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .brand-name { font-weight: 700; font-size: 19px; }
  .faturamento-tarja { font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 6px; margin-top: 3px; display: inline-block; color: #bbf7d0; }
  .btn-close-top { background: none; border: none; color: #fff; font-size: 22px; text-decoration: none; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 10; }
  .tabbar button { background: none; border: none; padding: 6px; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; flex: 1; }
  .tabbar button.active { color: var(--accent); font-weight: 600; }
  .tabbar button .ic { font-size: 20px; margin-bottom: 2px; }
  .card-panel { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
  .panel-title { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--text-secondary); text-transform: uppercase; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; }
  .list-item:last-child { border-bottom: none; }
  .empty { text-align: center; padding: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_uF7dXCy27GG5-PnvVszpWw_hmgMjfK5";
const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

const state = { tab: "relatorios", tabs: [], itensProdutos: [], totalFaturado: 0 };

async function sbGet(table, query) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers });
    if (!res.ok) return [];
    return res.json();
  } catch (e) { return []; }
}
function formatMoney(v) { return "R$ " + (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function render() {
  const app = document.getElementById("app"); app.innerHTML = "";
  const main = document.createElement("main"); main.appendChild(Body());
  app.appendChild(TopBar()); app.appendChild(main); app.appendChild(Tabbar());
}

function TopBar(){
  const bar = document.createElement("div"); bar.className="topbar";
  const subinfo = state.tab === "relatorios" ? `<div class="faturamento-tarja" id="tarja-faturamento">Faturamento Total: ${formatMoney(state.totalFaturado)}</div>` : `<div style="font-size:12px; opacity:0.7;">Gestão Geral</div>`;
  bar.innerHTML = `<div class="brand"><div class="brand-mark">CP</div><div><div class="brand-name">Admin</div>${subinfo}</div></div><a href="index.html" class="btn-close-top">✕</a>`;
  return bar;
}

function Tabbar(){
  const bar = document.createElement("div"); bar.className="tabbar";
  const items = [["abas","🏷️","Abas"], ["relatorios","📊","Relatórios"]];
  items.forEach(([key,ic,label])=>{
    const b = document.createElement("button"); b.className = state.tab===key ? "active" : "";
    b.innerHTML = `<span class="ic">${ic}</span><span>${label}</span>`;
    b.onclick = () => { state.tab = key; render(); }; bar.appendChild(b);
  });
  return bar;
}

function Body(){
  const wrap = document.createElement("div");
  if(state.tab === "abas") wrap.appendChild(AdminTabs());
  if(state.tab === "relatorios") wrap.appendChild(ReportsPanel());
  return wrap;
}

function AdminTabs(){
  const div = document.createElement("div"); div.innerHTML = `<div class="card-panel"><p class="panel-title">Abas Cadastradas</p><div id="tabsList"></div></div>`;
  setTimeout(() => {
    const list = div.querySelector("#tabsList");
    if(state.tabs.length === 0) list.innerHTML = '<div class="empty">Nenhuma aba cadastrada.</div>';
    else state.tabs.forEach(t => { list.innerHTML += `<div class="list-item"><b>${t.name}</b></div>`; });
  }, 30);
  return div;
}

function ReportsPanel(){
  const div = document.createElement("div"); div.innerHTML = `<div class="card-panel"><p class="panel-title">Resumo por Produto</p><div id="salesList"></div></div>`;
  setTimeout(() => {
    const list = div.querySelector("#salesList");
    if(!state.itensProdutos || state.itensProdutos.length === 0) { 
      list.innerHTML = '<div class="empty">Nenhum produto cadastrado ou vendido encontrado.</div>'; 
    } else {
      list.innerHTML = "";
      state.itensProdutos.forEach((p, idx) => {
        // Verifica o total faturado individual do produto (vendas acumuladas)
        let valorVendido = Number(p.total_sales || p.faturamento || p.vendas_total || p.total || 0);
        let estoqueInfo = p.sales_count || p.quantidade_vendida || p.qtd || 0;
        
        list.innerHTML += `<div class="list-item"><div><b>${p.name || 'Produto'}</b><div style="font-size:11px; color:var(--text-secondary);">Quantidade: ${estoqueInfo} itens vendidos</div></div><span style="color:var(--green); font-weight:bold;">${formatMoney(valorVendido)}</span></div>`;
      });
    }
  }, 30);
  return div;
}

async function init() {
  try { state.tabs = await sbGet("tabs", "select=*"); } catch(e) {}
  
  // Conecta diretamente na tabela 'products' que está liberada (UNRESTRICTED)
  let dadosProdutos = await sbGet("products", "select=*");
  state.itensProdutos = dadosProdutos || [];
  
  // Realiza a soma de faturamento somando as colunas de faturamento acumulado por produto
  state.totalFaturado = state.itensProdutos.reduce((acc, p) => {
    let valorItem = Number(p.total_sales || p.faturamento || p.vendas_total || p.total || 0);
    return acc + valorItem;
  }, 0);
  
  render();
}
init();
</script>
</body>
</html>
