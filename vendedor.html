<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardPay Vendedor</title>
<link rel="manifest" href="manifest-vendedor.webmanifest">

<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#0f4278">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CardPay Vendedor">

<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --border: #e2e2df;
    --text: #1a1a18;
    --text-secondary: #6b6b66;
    --text-muted: #9a9a94;
    --accent: #185fa5;
    --accent-dark: #0f4278;
    --green: #0f6e56;
    --red: #a32d2d;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 60px; min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; margin: -16px -16px 16px;
    background: var(--accent-dark); color: #fff;
  }
  .topbar .logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: #14b8a6; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .sub { font-size: 12px; opacity: 0.8; }
  .topbar .back { margin-left: auto; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .tile { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .tile .icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .tile .icon.admin { background: #fde68a; }
  .tile .icon.vendedor { background: #bbf7d0; }
  .tile .icon.caixa { background: #bae6fd; }
  .tile h2 { font-size: 16px; margin: 0 0 2px; }
  .tile p { font-size: 13px; color: var(--text-secondary); margin: 0; }
  h2.section-title { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 12px; font-family: inherit;
  }
  select { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
  button {
    padding: 11px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer; width: 100%;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
  button.block-sm { width: auto; padding: 8px 12px; font-size: 13px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
  .list-item .info b { font-size: 14px; }
  .list-item .info p { font-size: 12px; color: var(--text-secondary); margin: 2px 0 0; }
  .tabs-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
  .tabs-nav button { width: auto; white-space: nowrap; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .tabs-nav button.active { background: var(--accent); color: #fff; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .msg.success { background: #d1fae5; color: var(--green); }
  .msg.error { background: #fee2e2; color: var(--red); }
  .hidden { display: none !important; }
  #qr-reader { width: 100%; margin-bottom: 12px; border-radius: 8px; overflow: hidden; }
  .produto-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .qty-ctl { display: flex; align-items: center; gap: 10px; }
  .qty-ctl button { width: 32px; height: 32px; padding: 0; border-radius: 50%; }
  .cart-total { font-size: 18px; font-weight: 700; text-align: center; margin: 14px 0; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div id="app"></div>
</div>

<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_uF7dXCy27GG5-PnvVszpWw_hmgMjfK5";
const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

// ---------- Helpers Supabase ----------
async function sbGet(table, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbInsert(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST", headers: { ...headers, "Prefer": "return=representation" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbUpdate(table, match, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${match}`, {
    method: "PATCH", headers: { ...headers, "Prefer": "return=representation" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbDelete(table, match) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${match}`, { method: "DELETE", headers });
  if (!res.ok) throw new Error(await res.text());
}

function formatMoney(v) {
  return "R$ " + (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function mostrarErroCarregamento(titulo, voltarPara, erro) {
  let detalhe = "";
  try {
    const parsed = JSON.parse(erro.message);
    detalhe = parsed.message || parsed.hint || erro.message;
  } catch (e) {
    detalhe = erro.message;
  }
  app.innerHTML = `
    ${topbar(titulo, "", true, voltarPara)}
    <div class="card">
      <p class="msg error">Não foi possível carregar os dados.</p>
      <p style="font-size:12px; color:var(--text-secondary); word-break:break-word;">${detalhe}</p>
    </div>
  `;
}

// ---------- Estado da aplicação ----------
const state = {
  tela: "home",
  vendedor: null,
  caixa: null,
  tabAtiva: null,
  carrinho: [],
  adminSecao: "abas",
  appSettings: null,
  appSettingsErro: null,
  configLiberado: false
};

const app = document.getElementById("app");

function ir(tela) {
  state.tela = tela;
  render();
}

function topbar(titulo, subtitulo, temVoltar, voltarPara) {
  return `
    <div class="topbar">
      <div class="logo">CP</div>
      <div>
        <h1>${titulo}</h1>
        ${subtitulo ? `<div class="sub">${subtitulo}</div>` : ""}
      </div>
      ${temVoltar ? `<button class="back" onclick="ir('${voltarPara}')">✕</button>` : ""}
    </div>
  `;
}

// ---------- Configurações do app (período, senha admin, taxa) ----------
async function carregarAppSettings() {
  try {
    const rows = await sbGet("app_settings", "select=*&limit=1");
    state.appSettings = rows || null;
    state.appSettingsErro = null;
  } catch (e) {
    state.appSettings = null;
    state.appSettingsErro = e.message;
  }
}

function dentroDoPeríodo() {
  if (!state.appSettings) return true; 
  const { start_date, end_date } = state.appSettings;
  return true;
}

// ---------- Renderizador de Telas ----------
async function render() {
  if (!state.appSettings && !state.appSettingsErro) {
    await carregarAppSettings();
  }

  if (state.tela === "home") {
    renderHome();
  } else if (state.tela === "login_vendedor") {
    renderLoginVendedor();
  } else if (state.tela === "venda") {
    renderVenda();
  }
}

function renderHome() {
  app.innerHTML = `
    ${topbar("CardPay", "Selecione o seu perfil", false)}
    <div class="card tile" onclick="ir('login_vendedor')">
      <div class="icon vendedor">👤</div>
      <div>
        <h2>Área do Vendedor</h2>
        <p>Acessar painel de vendas e leitura de cartões</p>
      </div>
    </div>
  `;
}

function renderLoginVendedor() {
  app.innerHTML = `
    ${topbar("Login Vendedor", "Identifique-se", true, "home")}
    <div class="card">
      <label>Selecione seu usuário</label>
      <select id="select-vendedor">
        <option value="">Carregando vendedores...</option>
      </select>
      <button id="btn-entrar" style="margin-top:8px;">Entrar</button>
      <div id="login-msg" style="margin-top:10px;"></div>
    </div>
  `;
  
  sbGet("vendedores", "select=*&order=name")
    .then(dados => {
      const select = document.getElementById("select-vendedor");
      select.innerHTML = '<option value="">Escolha seu nome</option>';
      dados.forEach(v => {
        select.innerHTML += `<option value="${v.id}">${v.name}</option>`;
      });
    }).catch(e => {
      document.getElementById("login-msg").innerHTML = `<p class="msg error">Erro ao carregar lista.</p>`;
    });

  document.getElementById("btn-entrar").onclick = () => {
    const sel = document.getElementById("select-vendedor");
    if(!sel.value) return;
    state.vendedor = { id: sel.value, name: sel.options[sel.selectedIndex].text };
