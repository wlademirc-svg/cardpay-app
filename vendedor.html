<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardPay Vendedor</title>
<script src="https://cloudflare.com"></script>
<style>
  :root {
    --bg: #f4f4f2; --card: #ffffff; --border: #e2e2df; --text: #1a1a18;
    --text-secondary: #6b6b66; --accent: #185fa5; --accent-dark: #0f4278;
    --green: #0f6e56; --red: #a32d2d; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 60px; min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; margin: -16px -16px 16px; background: var(--accent-dark); color: #fff; }
  .topbar .logo { width: 36px; height: 36px; border-radius: 8px; background: #14b8a6; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .back { margin-left: auto; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  h2.section-title { font-size: 15px; margin: 0 0 10px; }
  select { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
  button { padding: 11px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; width: 100%; }
  .produto-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .qty-ctl { display: flex; align-items: center; gap: 10px; }
  .qty-ctl button { width: 32px; height: 32px; padding: 0; border-radius: 50%; }
  .cart-total { font-size: 18px; font-weight: 700; text-align: center; margin: 14px 0; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .msg.success { background: #d1fae5; color: var(--green); }
  .msg.error { background: #fee2e2; color: var(--red); }
  #qr-reader { width: 100%; margin-bottom: 12px; border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div id="app"></div></div>
<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_uF7dXCy27GG5-PnvVszpWw_hmgMjfK5";
const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

async function sbGet(table, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers });
  return res.json();
}
async function sbInsert(table, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method: "POST", headers: { ...headers, "Prefer": "return=representation" }, body: JSON.stringify(body) });
  return res.json();
}

const state = { tela: "login_vendedor", vendedor: null, carrinho: [] };
const app = document.getElementById("app");

function ir(tela) { state.tela = tela; render(); }
function formatMoney(v) { return "R$ " + (Number(v) || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function topbar(titulo, temVoltar, voltarPara) { return `<div class="topbar"><div class="logo">CP</div><div><h1>${titulo}</h1></div>${temVoltar ? `<button class="back" onclick="ir('${voltarPara}')">✕</button>` : ""}</div>`; }

function render() {
  if (state.tela === "login_vendedor") renderLoginVendedor();
  if (state.tela === "venda") renderVenda();
}

function renderLoginVendedor() {
  app.innerHTML = `${topbar("Login Vendedor", false)}<div class="card"><label>Selecione seu usuário</label><select id="select-vendedor"><option value="">Carregando...</option></select><button id="btn-entrar" style="margin-top:8px;">Entrar</button><div id="login-msg"></div></div>`;
  sbGet("vendedores", "select=*&order=name").then(dados => {
    const s = document.getElementById("select-vendedor"); s.innerHTML = '<option value="">Escolha seu nome</option>';
    dados.forEach(v => { s.innerHTML += `<option value="${v.id}">${v.name}</option>`; });
  }).catch(() => { document.getElementById("login-msg").innerHTML = '<p class="msg error">Erro ao carregar lista.</p>'; });
  document.getElementById("btn-entrar").onclick = () => {
    const sel = document.getElementById("select-vendedor"); if(!sel.value) return;
    state.vendedor = { id: sel.value, name: sel.options[sel.selectedIndex].text }; ir("venda");
  };
}

function renderVenda() {
  app.innerHTML = `${topbar("Nova Venda", true, "login_vendedor")}<div class="card" id="secao-pagamento"><h2 class="section-title">🛒 Finalizar & Ler Cartão</h2><div class="cart-total" id="total-venda">Total: R$ 0,00</div><div id="qr-reader"></div><button id="btn-ler-cartao" style="margin-bottom:10px;">Iniciar Leitor QR</button><button id="btn-confirmar-venda" style="background:var(--green); display:none;">Confirmar Venda</button><div id="venda-status"></div></div><div class="card"><h2 class="section-title">Produtos Disponíveis</h2><div id="lista-produtos-venda">Carregando itens...</div></div>`;
  let totalGeral = 0; let scanner = null;
  function atualizarTotal() {
    totalGeral = state.carrinho.reduce((acc, item) => acc + (item.price * item.qtd), 0);
    document.getElementById("total-venda").innerText = `Total: ${formatMoney(totalGeral)}`;
    document.getElementById("btn-confirmar-venda").style.display = totalGeral > 0 ? "block" : "none";
  }
  sbGet("produtos", "select=*&order=name").then(produtos => {
    const container = document.getElementById("lista-produtos-venda"); container.innerHTML = "";
    produtos.forEach(p => {
      const div = document.createElement("div"); div.className = "produto-item";
      div.innerHTML = `<div class="info"><b>${p.name}</b><p>${formatMoney(p.price)}</p></div><div class="qty-ctl"><button class="btn-menos">-</button><span id="qtd-${p.id}">0</span><button class="btn-mais">+</button></div>`;
      div.querySelector(".btn-mais").onclick = () => {
        let item = state.carrinho.find(c => c.id === p.id); if(!item) { item = { id: p.id, name: p.name, price: p.price, qtd: 0 }; state.carrinho.push(item); }
        item.qtd++; div.querySelector(`#qtd-${p.id}`).innerText = item.qtd; atualizarTotal();
      };
      div.querySelector(".btn-menos").onclick = () => {
        let item = state.carrinho.find(c => c.id === p.id); if(item && item.qtd > 0) { item.qtd--; div.querySelector(`#qtd-${p.id}`).innerText = item.qtd; if(item.qtd === 0) state.carrinho = state.carrinho.filter(c => c.id !== p.id); atualizarTotal(); }
      };
      container.appendChild(div);
    });
  });
  document.getElementById("btn-ler-cartao").onclick = () => {
    if (!scanner) {
      scanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250 });
      scanner.render((text) => { document.getElementById("venda-status").innerHTML = `<p class="msg success">Lido: ${text}</p>`; scanner.clear(); scanner = null; });
    }
  };
  document.getElementById("btn-confirmar-venda").onclick = async () => {
    if(state.carrinho.length === 0) return;
    try {
      await sbInsert("card_transactions", { vendedor_id: state.vendedor.id, total: totalGeral, description: state.carrinho.map(c=>`${c.qtd}x ${c.name}`).join(", "), created_at: new Date() });
      document.getElementById("venda-status").innerHTML = '<p class="msg success">Venda concluída!</p>'; state.carrinho = []; ir("venda");
    } catch(e) { document.getElementById("venda-status").innerHTML = '<p class="msg error">Erro ao salvar.</p>'; }
  };
}
render();
</script>
</body>
</html>
